<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Login to your account</p>
    </div>


    <form class="auth-form" (ngSubmit)="login()">
      <!-- Email Input -->
      <div class="form-group">
        <input
          id="email"
          type="email"
          class="form-input"
          placeholder="Email Address"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          required
        />
      </div>

      <div class="form-group">
        <div class="password-input-wrapper">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-input"
            placeholder="Password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            required
          />
          <button
            type="button"
            class="password-toggle"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            {{ showPassword() ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        <div class="forgot-password-link">
          <a routerLink="/forgot-password" class="link-small">Forgot password?</a>
        </div>
      </div>

      <!-- Error Message -->
      @if (error()) {
        <div class="alert alert-error">
          {{ error() }}
        </div>
      }

      <!-- Success Message -->
      @if (successMessage()) {
        <div class="alert alert-success">
          {{ successMessage() }}
        </div>
      }

      <!-- Login Button -->
      @if (!usePasswordless() || codeSent()) {
        <button
          type="submit"
          class="btn btn-primary btn-full"
          [disabled]="isLoading()"
        >
          {{ isLoading() ? 'Logging in...' : 'Login' }}
        </button>
      }
    </form>

    <div class="divider">
      <span>or continue with</span>
    </div>

    <!-- Social Login Options -->
    <div class="social-login-section">
      <button
        type="button"
        class="social-btn google-btn"
        (click)="loginWithGoogle()"
        [disabled]="isLoading()"
      >
        <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
      </button>

      <button
        type="button"
        class="social-btn apple-btn"
        (click)="loginWithApple()"
        [disabled]="isLoading()"
      >
        <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
        </svg>
        Apple
      </button>

      <button
        type="button"
        class="social-btn x-btn"
        (click)="loginWithX()"
        [disabled]="isLoading()"
      >
        <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        X
      </button>

      <div class="telegram-widget-wrapper">
        <div id="telegram-login-widget-container"></div>
      </div>
    </div>

    <!-- Register Link -->
    <div class="auth-footer">
      <p class="auth-link-text">
        Don't have an account?
        <a routerLink="/register" class="auth-link">Register</a>
      </p>
    </div>
  </div>
</div>
