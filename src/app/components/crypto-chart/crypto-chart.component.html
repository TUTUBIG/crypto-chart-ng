<div class="crypto-chart-widget" [class.dark]="theme === 'dark'">
  @if (chartData.error) {
    <div class="widget-error">
      <span class="error-icon">⚠️</span>
      <span class="error-text">{{ chartData.error }}</span>
      <button class="error-retry" (click)="refreshData()">
        Retry
      </button>
    </div>
  }

  <!-- Loading Overlay -->
  @if (chartData.isLoading) {
    <div class="widget-loading">
      <div class="loading-spinner"></div>
      <span class="loading-text">Loading chart data...</span>
    </div>
  }

  <!-- Chart Container -->
  <div class="widget-chart-container">
    <div #chartContainer class="chart-container"></div>
    
    @if (customLogoUrl) {
      <img [src]="customLogoUrl" alt="Logo" class="custom-attribution-logo" />
    }
  </div>
</div>
